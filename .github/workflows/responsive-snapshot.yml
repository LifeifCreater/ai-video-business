name: Apply reviewed responsive patch (temporary)
on:
  push:
    branches: [fix/column-duo-responsive-20261031]
    paths: [.github/workflows/responsive-snapshot.yml]
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/fix/column-duo-responsive-20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply only checksum-verified display changes
        run: |
          python3 scripts/apply-responsive-once.py
          node --test tests/*.test.cjs
          git diff --check
          rm scripts/apply-responsive-once.py .github/workflows/responsive-snapshot.yml
          git add -- '*.html' scripts/apply-responsive-once.py .github/workflows/responsive-snapshot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: keep article content visible and load responsive styles across public pages'
          git push origin HEAD:refs/heads/fix/column-duo-responsive-20261031
      - name: Export exact patched public-site fixture
        run: |
          mkdir -p /tmp/framepact-responsive-source
          git archive --format=zip --output=/tmp/framepact-responsive-source/site.zip HEAD '*.html' '*.css' '*.js' '*.png' '*.ico' '*.webp' scripts tests images .github/workflows AGENTS.md _headers _redirects wrangler.jsonc .assetsignore sitemap.xml robots.txt
          git rev-parse HEAD > /tmp/framepact-responsive-source/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: responsive-source
          path: /tmp/framepact-responsive-source
          retention-days: 1
