<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ページが見つかりません｜FRAMEPACT</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--black:#111;--white:#fff;--offwhite:#f7f7f5;--yellow:#d6b36a;--gray:#b8b8b3}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:32px;background:var(--black);color:var(--white);font-family:Inter,"IBM Plex Sans JP",sans-serif;line-height:1.8}
main{width:min(720px,100%);text-align:center}
.code{margin:0 0 12px;color:var(--yellow);font-size:.78rem;font-weight:600;letter-spacing:.28em}
h1{margin:0;font-size:clamp(2rem,7vw,4rem);line-height:1.3;letter-spacing:-.02em;text-wrap:balance}
p{margin:24px auto 0;max-width:560px;color:var(--gray)}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:36px}
a{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:14px 28px;border:1px solid var(--white);border-radius:2px;color:inherit;text-decoration:none;font-weight:600}
a.primary{background:var(--white);color:var(--black)}
a:focus-visible{outline:2px solid var(--yellow);outline-offset:4px}
@media(max-width:480px){.actions{flex-direction:column}.actions a{width:100%}}
</style>
</head>
<body>
<main>
  <p class="code">404 NOT FOUND</p>
  <h1>ページが見つかりません</h1>
  <p>URLが変更されたか、ページが削除された可能性があります。トップページまたはサービス一覧から目的の情報をお探しください。</p>
  <div class="actions">
    <a class="primary" href="/">トップページへ戻る</a>
    <a href="/#services">サービスを見る</a>
    <a href="/#contact">お問い合わせ</a>
  </div>
</main>
</body>
</html>
